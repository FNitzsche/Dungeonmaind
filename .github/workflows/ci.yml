name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight backend test dependencies
        run: >
            python -m pip install
            "pydantic>=2.12.0"
            "pydantic-settings==2.10.1"
            "requests>=2.32.5"
            "numpy>=2.0.0"
            "fastapi==0.119.0"
            "httpx==0.28.1"

      - name: Check Python syntax
        run: python -m compileall -q backend/app backend/tests

      - name: Run backend unit tests
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -v
