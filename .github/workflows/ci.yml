name: CI

on:
  push:
    branches: [main, Prototype-Entity-Extraction]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint with ruff
        run: ruff check --output-format=github

      - name: Check formatting with ruff
        run: ruff format --check

      - name: Run tests with pytest
        run: python -m pytest tests/ -v --tb=short

  frontend:
    name: Frontend (ESLint + Prettier + type-check + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint with ESLint
        run: npm run lint

      - name: Check formatting with Prettier
        run: npx prettier --check src/

      - name: Type-check with vue-tsc
        run: npm run type-check

      # No test files exist yet; re-enable when tests are added
      # - name: Run unit tests
      #   run: npm run test:unit -- --run

  # ──────────────────────────────────────────────
  # Optional: require clean pre-commit on repo root
  # ──────────────────────────────────────────────
  pre-commit:
    name: Pre-commit alignment check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
